<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Отчёт по анестезии</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
    margin: 0; padding: 15px 15px 100px 15px; background: #f2f2f7; color: #111; 
  }
  h1 { font-size: 22px; text-align: center; margin: 0 0 15px 0; }
  
  .card, .med-row { background: #fff; border-radius: 12px; }
  .card { padding: 15px; margin-bottom: 15px; }
  
  label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 5px; color: #555; }
  input, select, button, textarea { 
    font-family: inherit; font-size: 16px; padding: 12px; border: 1px solid #c7c7cc; 
    border-radius: 10px; background: #fff; color: #111; width: 100%; margin-bottom: 12px; 
  }
  textarea { resize: vertical; min-height: 90px; line-height: 1.4; margin-bottom: 0; }
  
  .time-row, .targets-row { display: flex; gap: 10px; }
  .time-row > div, .targets-row > div { flex: 1; }

  .med-row { 
    display: flex; align-items: center; justify-content: space-between; 
    padding: 12px 15px; margin-bottom: 8px; 
  }
  .med-name { flex: 1; font-size: 15px; line-height: 1.3; padding-right: 10px; }
  .med-name .sub { display: block; color: #8e8e93; font-size: 12px; margin-top: 2px; }
  
  .med-inputs { display: flex; gap: 5px; flex-shrink: 0; }
  .med-inputs input { width: 65px; margin: 0; padding: 10px; text-align: center; }
  .med-inputs select { width: 90px; margin: 0; padding: 10px; }

  .btn-template { background: #34c759; color: #fff; border: none; font-weight: 600; margin-bottom: 0; }
  
  .bottom-bar {
    position: fixed; left: 0; right: 0; bottom: 0; 
    padding: 12px 15px calc(12px + env(safe-area-inset-bottom));
    background: rgba(242, 242, 247, 0.95); backdrop-filter: blur(10px);
    display: flex; gap: 10px; border-top: 1px solid #d1d1d6;
  }
  .bottom-bar button { margin: 0; border: none; font-weight: 600; }
  .btn-copy { background: #0a84ff; color: #fff; flex: 2; }
  .btn-reset { background: #e5e5ea; color: #111; flex: 1; }
  pre { 
    padding: 15px; white-space: pre-wrap; word-break: break-word; 
    font-size: 15px; line-height: 1.45; background: #fff; border-radius: 12px; 
    margin-bottom: 20px; 
  }

  @media (prefers-color-scheme: dark) {
    body { background: #000; color: #f2f2f7; }
    .card, .med-row, pre { background: #1c1c1e; }
    input, select, textarea { background: #2c2c2e; color: #fff; border-color: #3a3a3c; }
    .bottom-bar { background: rgba(0,0,0,0.9); border-top: 1px solid #333; }
    .btn-reset { background: #2c2c2e; color: #fff; }
    .med-name .sub { color: #8e8e93; }
  }
</style>
</head>
<body>
<h1>Отчёт по анестезии</h1>

<div class="card">
  <label>Использовано на</label>
  <input id="title" value="MAC-анестезию">
  
  <div class="time-row">
    <div>
      <label>Начало</label>
      <input id="start" value="09:10" inputmode="numeric" placeholder="ЧЧ:ММ">
    </div>
    <div>
      <label>Окончание</label>
      <input id="end" value="11:25" inputmode="numeric" placeholder="ЧЧ:ММ">
    </div>
  </div>

  <div class="targets-row">
    <div>
      <label>СеТ Пропофола (мкг/мл)</label>
      <input id="tci" value="1,5-2" placeholder="1,5-2">
    </div>
    <div>
      <label>СеТ Дексдора (нг/мл)</label>
      <input id="dexmed_target" value="0,8 - 1,0" placeholder="0,8 - 1,0">
    </div>
  </div>

  <label>Заключение (авто-дополнение)</label>
  <textarea id="conclusion">Течение седации гладкое, уровень RASS соответствовал целевому (-2). Пробуждение своевременное, без респираторных и гемодинамических нарушений.</textarea>
  
  <button id="template" class="btn-template" style="margin-top: 12px;">Шаблон MAC-анестезия</button>
</div>

<div id="rows"></div>

<pre id="preview"></pre>

<div class="bottom-bar">
  <button id="copy" class="btn-copy">Скопировать отчёт</button>
  <button id="reset" class="btn-reset">Сброс</button>
</div>

<script>
const STORAGE_KEY = 'anes_report_v2';
const meds = [
  { id:'prop10', name:'Пропофол', conc:'10 мг/мл', concVal:10, per:20, unit:'ампула', doseUnit:'мг' },
  { id:'prop20', name:'Пропофол', conc:'20 мг/мл', concVal:20, per:50, unit:'флакон', doseUnit:'мг' },
  { id:'dexmed', name:'Дексмедетомидин', conc:'100 мкг/мл', concVal:100, per:2, unit:'ампула', doseUnit:'мкг' },
  { id:'droper', name:'Дроперидол', conc:'2,5 мг/мл', concVal:2.5, per:2, unit:'ампула', doseUnit:'мг' },
  { id:'dexa', name:'Дексаметазон', conc:'4 мг/мл', concVal:4, per:1, unit:'ампула', doseUnit:'мг' },
  { id:'metocl', name:'Метоклопрамид', conc:'5 мг/мл', concVal:5, per:2, unit:'ампула', doseUnit:'мг' },
  { id:'latran', name:'Латран', conc:'4 мг/мл', concVal:4, per:2, unit:'ампула', doseUnit:'мг' },
  { id:'suprastin', name:'Супрастин', conc:'20 мг/мл', concVal:20, per:1, unit:'ампула', doseUnit:'мг' },
  { id:'adren', name:'Адреналин', conc:'1 мг/мл', concVal:1, per:1, unit:'ампула', doseUnit:'мг' },
  { id:'atrop', name:'Атропин', conc:'1 мг/мл', concVal:1, per:1, unit:'ампула', doseUnit:'мг' },
  { id:'tranexam', name:'Транексам', conc:'50 мг/мл', concVal:50, per:5, unit:'ампула', doseUnit:'мг' },
  { id:'ketanov', name:'Кетанов', conc:'30 мг/мл', concVal:30, per:1, unit:'ампула', doseUnit:'мг' },
  { id:'nefopam', name:'Нефопам', conc:'10 мг/мл', concVal:10, per:2, unit:'ампула', doseUnit:'мг' },
  { id:'analgin', name:'Анальгин', conc:'500 мг/мл', concVal:500, per:2, unit:'ампула', doseUnit:'мг' },
  { id:'paracet', name:'Парацетамол', conc:'10 мг/мл', concVal:10, per:100, unit:'флакон', doseUnit:'мг' },
  { id:'nacl', name:'Натрия хлорид', conc:'0,9%', special:'nacl', unit:'флакон', doseUnit:'мл' },
  { id:'lidoc', name:'Лидокаин', conc:'20 мг/мл', concVal:20, per:2, unit:'ампула', doseUnit:'мг' },
  { id:'mezaton', name:'Мезатон', conc:'10 мг/мл', concVal:10, per:1, unit:'ампула', doseUnit:'мг' },
  { id:'enap', name:'Энап Р', conc:'1,25 мг/мл', concVal:1.25, per:1, unit:'ампула', doseUnit:'мг' },
  { id:'urapidil', name:'Урапидил', conc:'5 мг/мл', concVal:5, per:5, unit:'ампула', doseUnit:'мг' },
  { id:'metoprolol', name:'Метопролол', conc:'1 мг/мл', concVal:1, per:5, unit:'ампула', doseUnit:'мг' }
];

const titleEl = document.getElementById('title');
const startEl = document.getElementById('start');
const endEl = document.getElementById('end');
const tciEl = document.getElementById('tci');
const dexmedTargetEl = document.getElementById('dexmed_target');
const conclusionEl = document.getElementById('conclusion');
const rowsEl = document.getElementById('rows');
const preview = document.getElementById('preview');
const copyBtn = document.getElementById('copy');

const baseText = 'Течение седации гладкое, уровень RASS соответствовал целевому (-2)';
const endText = '. Пробуждение своевременное, без респираторных и гемодинамических нарушений.';
let lastDefault = baseText + endText;

// Функция авто-форматирования времени
function maskTime(e) {
  let input = e.target;
  let val = input.value.replace(/\D/g, ''); 
  if (val.length > 4) val = val.slice(0, 4); 
  if (val.length > 2) {
    val = val.slice(0, 2) + ':' + val.slice(2); 
  }
  input.value = val;
}

function fmt(n) { return !isFinite(n) ? '0' : (Math.round(n * 1000) / 1000).toString().replace('.', ','); }
function unitWord(unit, n) {
  const a = Math.abs(n) % 100, l = a % 10;
  if (a >= 11 && a <= 14) return unit === 'ампула' ? 'ампул' : 'флаконов';
  if (l === 1) return unit === 'ампула' ? 'ампула' : 'флакон';
  if (l >= 2 && l <= 4) return unit === 'ампула' ? 'ампулы' : 'флакона';
  return unit === 'ампула' ? 'ампул' : 'флаконов';
}

function renderRows() {
  rowsEl.innerHTML = meds.map(med => {
    const meta = med.special === 'nacl' ? 'флакон · 250/500 мл' : `${med.per} мл · ${med.unit}`;
    const nameHtml = `<div class="med-name">${med.name} ${med.conc}<span class="sub">${meta}</span></div>`;
    
    let inputsHtml = '';
    if (med.special === 'nacl') {
      inputsHtml = `
        <div class="med-inputs">
          <select data-vol="${med.id}" aria-label="Объём флакона">
            <option value="250">250</option>
            <option value="500">500</option>
          </select>
          <input type="number" min="0" step="1" value="0" inputmode="numeric" data-qty="${med.id}" aria-label="Кол-во">
        </div>`;
    } else {
      inputsHtml = `
        <div class="med-inputs">
          <input type="number" min="0" step="1" value="0" inputmode="numeric" data-qty="${med.id}" aria-label="Кол-во ${med.name}">
        </div>`;
    }
    return `<div class="med-row">${nameHtml}${inputsHtml}</div>`;
  }).join('');

  rowsEl.querySelectorAll('input, select').forEach(el => {
    el.addEventListener('input', update);
    el.addEventListener('change', update);
  });
}

function collectState() {
  const s = { 
    title: titleEl.value, 
    start: startEl.value, 
    end: endEl.value, 
    tci: tciEl.value, 
    dexmed_target: dexmedTargetEl.value,
    conclusion: conclusionEl.value, 
    qty:{}, vol:{} 
  };
  document.querySelectorAll('[data-qty]').forEach(el => s.qty[el.dataset.qty] = el.value);
  document.querySelectorAll('[data-vol]').forEach(el => s.vol[el.dataset.vol] = el.value);
  return s;
}

function applyState(s) {
  if (!s) return;
  if (s.title !== undefined) titleEl.value = s.title;
  if (s.start !== undefined) startEl.value = s.start;
  if (s.end !== undefined) endEl.value = s.end;
  if (s.tci !== undefined) tciEl.value = s.tci;
  if (s.dexmed_target !== undefined) dexmedTargetEl.value = s.dexmed_target;
  if (s.conclusion !== undefined) conclusionEl.value = s.conclusion;
  if (s.qty) Object.entries(s.qty).forEach(([id, v]) => { const el = document.querySelector(`[data-qty="${id}"]`); if (el) el.value = v; });
  if (s.vol) Object.entries(s.vol).forEach(([id, v]) => { const el = document.querySelector(`[data-vol="${id}"]`); if (el) el.value = v; });
}

function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(collectState())); } catch(e){} }
function loadState() { try { const r = localStorage.getItem(STORAGE_KEY); return r ? JSON.parse(r) : null; } catch(e){ return null; } }

function update() {
  const title = titleEl.value.trim() || 'MAC-анестезию';
  const start = startEl.value.trim();
  const end = endEl.value.trim();
  const lines = [`Использовано на ${title} (${start} - ${end}):`];
  
  let hasMeds = false;
  let hasPropofol = false;
  let hasDexmed = false;

  meds.forEach(med => {
    const qtyEl = document.querySelector(`[data-qty="${med.id}"]`);
    const qty = parseInt(qtyEl.value, 10);
    if (!Number.isFinite(qty) || qty <= 0) return;
    
    hasMeds = true;
    if (med.id === 'prop10' || med.id === 'prop20') hasPropofol = true;
    if (med.id === 'dexmed') hasDexmed = true;

    if (med.special === 'nacl') {
      const per = parseInt(document.querySelector(`[data-vol="${med.id}"]`).value, 10);
      const total = per * qty;
      lines.push(`${med.name} ${med.conc} - ${fmt(per)} мл - ${fmt(total)} мл (${qty} ${unitWord(med.unit, qty)});`);
    } else {
      const vol = med.per * qty;
      const dose = med.concVal * vol;
      lines.push(`${med.name} ${med.conc} - ${fmt(vol)} мл - ${fmt(dose)} ${med.doseUnit} (${qty} ${unitWord(med.unit, qty)});`);
    }
  });

  // Умное обновление заключения
  const tciVal = tciEl.value.trim();
  const dexmedVal = dexmedTargetEl.value.trim();
  
  let dynamicText = '';
  if (hasPropofol && tciVal) dynamicText += `, поддержание СеТ Пропофола ${tciVal} мкг/мл по TCI`;
  if (hasDexmed && dexmedVal) dynamicText += `, поддержание СеТ Дексдора ${dexmedVal} нг/мл`;
  
  let currentDefault = baseText + dynamicText + endText;
  
  if (conclusionEl.value === lastDefault || conclusionEl.value === '') {
    conclusionEl.value = currentDefault;
  }
  lastDefault = currentDefault;

  const conclusionText = conclusionEl.value.trim();
  
  if (hasMeds) {
    if (conclusionText) {
      lines.push(''); 
      lines.push(conclusionText);
    }
  } else {
    lines.push('— ничего не выбрано —');
  }
  
  preview.textContent = lines.join('\n');
  saveState();
}

function nowTime() {
  const d = new Date();
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

document.getElementById('template').addEventListener('click', () => {
  titleEl.value = 'MAC-анестезию'; 
  startEl.value = nowTime(); 
  endEl.value = '';
  tciEl.value = '1,5-2';
  dexmedTargetEl.value = '0,8 - 1,0';
  
  lastDefault = baseText + endText;
  conclusionEl.value = lastDefault;
  
  document.querySelectorAll('[data-qty]').forEach(el => el.value = '0');
  document.querySelectorAll('[data-vol]').forEach(el => el.value = '250');
  update();
});

document.getElementById('reset').addEventListener('click', () => {
  if (!confirm('Сбросить все введённые значения?')) return;
  titleEl.value = 'MAC-анестезию'; 
  startEl.value = ''; 
  endEl.value = '';
  tciEl.value = '1,5-2';
  dexmedTargetEl.value = '0,8 - 1,0';
  
  lastDefault = baseText + endText;
  conclusionEl.value = lastDefault;

  document.querySelectorAll('[data-qty]').forEach(el => el.value = '0');
  document.querySelectorAll('[data-vol]').forEach(el => el.value = '250');
  try { localStorage.removeItem(STORAGE_KEY); } catch(e){}
  update();
});

copyBtn.addEventListener('click', async () => {
  const text = preview.textContent;
  try { await navigator.clipboard.writeText(text); }
  catch(e) {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }
  copyBtn.textContent = 'Скопировано!';
  setTimeout(() => { copyBtn.textContent = 'Скопировать отчёт'; }, 1500);
});

titleEl.addEventListener('input', update);
startEl.addEventListener('input', function(e) { maskTime(e); update(); });
endEl.addEventListener('input', function(e) { maskTime(e); update(); });
tciEl.addEventListener('input', update);
dexmedTargetEl.addEventListener('input', update);
conclusionEl.addEventListener('input', update);

renderRows();
applyState(loadState());
update();
</script>
</body>
</html>
